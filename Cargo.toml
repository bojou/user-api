[package]
name = "user-api"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 0
debug = true

[dependencies]
rocket = { version = "0.5.1", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "macros", "chrono"] }